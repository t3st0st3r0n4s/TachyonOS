name: One-time import of working S901B TWRP TAR

on:
  push:
    branches: [r0s-fyi3]
    paths:
      - .github/workflows/twrp-import-once.yml

permissions:
  contents: write

jobs:
  import-twrp:
    if: github.repository == 't3st0st3r0n4s/TachyonOS'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import the one verified original TAR
        shell: bash
        run: |
          set -euo pipefail
          test -f TWRP/INSTALL.md
          test ! -e TWRP/S901B_twrp_vbmeta_only.tar
          mkdir -p TWRP
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://github.com/t3st0st3r0n4s/TachyonOS/releases/download/twrp-r0s-fyi3/S901B_twrp_vbmeta_only.tar' \
            --output TWRP/S901B_twrp_vbmeta_only.tar
          test "$(stat -c %s TWRP/S901B_twrp_vbmeta_only.tar)" -eq 67174400
          echo '32a3734a2ebe56628b2cd4ec3170c541cfcccac9bf5586c8682ad182f7174a68  TWRP/S901B_twrp_vbmeta_only.tar' | sha256sum -c -
          diff -u <(printf 'recovery.img\nvbmeta.img\n') <(tar -tf TWRP/S901B_twrp_vbmeta_only.tar | LC_ALL=C sort)

      - name: Keep only the TAR and INSTALL.md in the source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TWRP/S901B_twrp_vbmeta_only.tar
          git rm -- docs/r0s-fyi3-twrp-archive.md
          git rm -- .github/workflows/twrp-import-once.yml
          git diff --cached --check
          git commit -m "chore(r0s): retain working TWRP Odin TAR directly under TWRP/"
          git push origin HEAD:r0s-fyi3

      - name: Remove superseded duplicate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete twrp-r0s-fyi3 \
            --repo t3st0st3r0n4s/TachyonOS \
            --cleanup-tag --yes
